
<!DOCTYPE html>
<html>
<head>
    <title>Tarang Registration Form</title>
</head>

<body>

<center>

    <form>

        <h1>Tarang Registration Form</h1>

        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Department:</label>
        <input type="text">
        <br><br>

        <label>College Name:</label>
        <input type="text">
        <br><br>

        <hr>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel">
        <br><br>

        <label>Gender:</label><br>

        <input type="radio" name="gender"> Male
        <br>

        <input type="radio" name="gender"> Female
        <br>

        <input type="radio" name="gender"> Others
        <br><br>

        <hr>

        <h2>Event Details</h2>

        <label>Select the Event:</label><br>

        <select>
            <option>-- Select Event --</option>
            <option>Singing</option>
            <option>Dancing</option>
            <option>Drama</option>
            <option>Drawing</option>
            <option>Photography</option>
            <option>Quiz</option>
        </select>

        <br><br>

        <label>Event Date:</label>
        <input type="date">
        <br><br>

        <label>Food Preference:</label><br>

        <input type="radio" name="food"> Vegetarian
        <br>

        <input type="radio" name="food"> Non-Vegetarian
        <br><br>

        <label>Address:</label><br>

        <textarea rows="4" cols="40"></textarea>

        <br><br>

        <hr>

        <input type="checkbox">
        I agree to the terms and conditions.

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</center>

</body>
</html>
